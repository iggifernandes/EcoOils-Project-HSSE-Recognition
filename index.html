.cert{
  --green-dark:#025b40; --green-light:#5cb41f; --navy:#002060; --line:#008000;
  position:relative; width:297mm; height:210mm; background:#fff; overflow:hidden;
  font-family:'Jost','Century Gothic',sans-serif; font-size:2.97mm; color:var(--navy);
  box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.cert *{box-sizing:border-box;margin:0;padding:0}
.cert-bg{position:absolute;inset:0;width:100%;height:100%}
.cert-logo{position:absolute;left:76.4%;top:4.7%;width:23.2%;height:auto}

.cert-title{position:absolute;left:6.6%;top:20.6%;font-family:'Arvo','Rockwell',serif;font-weight:700;
  font-size:6.1em;line-height:1;letter-spacing:.05em;color:var(--green-dark);white-space:nowrap}
.cert-sub{position:absolute;left:6.7%;top:31.4%;font-size:3.08em;line-height:1;letter-spacing:.36em;
  color:var(--green-dark);font-weight:400;white-space:nowrap}
.cert-label{position:absolute;left:6.7%;top:38.0%;font-size:1.8em;letter-spacing:.06em;color:var(--green-dark);white-space:nowrap}

.cert-name{position:absolute;left:6.7%;top:42.2%;width:72%;height:8.6%;display:flex;align-items:flex-end;
  font-weight:700;font-size:4.1em;line-height:1.1;color:var(--navy);white-space:nowrap;overflow:hidden}
.cert-rule{position:absolute;left:6.7%;top:51.3%;width:70.5%;height:0;border-top:.22em solid var(--green-light)}
.cert-meta{position:absolute;left:6.7%;top:52.3%;width:70.5%;display:flex;justify-content:space-between;
  gap:2em;font-size:1.75em;line-height:1.2;color:var(--green-dark);font-weight:500}
.cert-meta .cert-date{text-align:right;font-weight:400}

.cert-body{position:absolute;left:6.6%;top:57.2%;width:80%;height:29.2%;font-size:2.05em;line-height:1.28;
  color:var(--navy);overflow:hidden}
/* float used to wrap text around the lower-right green triangle */
.cert-body .cert-wrap{float:right;width:8%;height:100%;
  shape-outside:polygon(100% 0,100% 66%,15% 100%,100% 100%);shape-margin:1.6em}
.cert-body p{margin:0 0 .55em 0;text-align:justify;hyphens:none}
.cert-body p.pers{font-weight:700;font-style:italic;margin-bottom:0}

.cert-sig{position:absolute;top:88.5%;width:24.85%;text-align:center}
.cert-sig.left{left:5.54%} .cert-sig.right{left:44.77%}
.cert-sig .sig-line{border-top:.3em solid var(--line);margin-bottom:.35em}
.cert-sig .sig-name{font-size:2.05em;line-height:1.2}
.cert-sig .sig-title{font-size:2.05em;line-height:1.2;font-weight:700;font-style:italic}

.cert-no{position:absolute;left:6.7%;bottom:.15%;height:3%;display:flex;align-items:center;
  font-size:1.05em;letter-spacing:.08em;color:#fff;opacity:.9}

/* ------- printing: one certificate per A4 landscape page ------- */
@page{size:A4 landscape;margin:0}
#printRoot{display:none}
@media print{
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .cert{page-break-after:always;break-after:page;margin:0;height:209.6mm}
  #printRoot .cert:last-child{page-break-after:auto;break-after:auto}
}

:root{
  --g-dark:#025b40; --g-light:#5cb41f; --navy:#002060;
  --bg:#f4f6f4; --card:#fff; --ink:#1b2a24; --muted:#5d6b64; --line:#d9e0db;
  --warn:#9a5b00; --warn-bg:#fff4dd; --err:#a4262c; --err-bg:#fde8e8; --ok:#1d6b2a;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121714; --card:#1b231f; --ink:#e6ede9; --muted:#9baba3; --line:#2c3832; --warn-bg:#3a2d10; --err-bg:#3b1c1e; --g-dark:#4aa57f;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.45 'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0 0 .6rem;font-weight:600}
h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--g-dark);margin-top:1.2rem}
h3:first-child{margin-top:0}
code{background:rgba(2,91,64,.1);padding:.1em .4em;border-radius:4px;font-size:.9em}
.muted,.hint{color:var(--muted);font-size:.86rem}

/* top bar */
.top{display:flex;align-items:center;gap:1.2rem;padding:.55rem 1.1rem;background:var(--g-dark);color:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:.7rem}
.brand img{height:38px;background:#fff;border-radius:6px;padding:2px 6px}
.brand b{display:block;font-size:1.05rem}
.brand small{opacity:.8}
.tabs{display:flex;gap:.25rem;flex:1}
.tabs button{background:transparent;border:0;color:#fff;opacity:.8;padding:.5rem .9rem;border-radius:8px;cursor:pointer}
.tabs button.on,.tabs button:hover{background:rgba(255,255,255,.16);opacity:1}
.top-right{display:flex;align-items:center;gap:.6rem}
.sync{font-size:.8rem;opacity:.9}
.sync::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:.4rem}
.sync.ok::before{background:var(--g-light)} .sync.err::before{background:#ff6b6b}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:.3rem .65rem;cursor:pointer}
.seg button.on{background:#fff;color:var(--g-dark);font-weight:600}
.top .ghost{color:#fff;border-color:rgba(255,255,255,.45)}

/* buttons / inputs */
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45rem .8rem;cursor:pointer}
button:hover{border-color:var(--g-dark)}
button.primary{background:var(--g-dark);border-color:var(--g-dark);color:#fff}
button.primary:hover{filter:brightness(1.1)}
button.ghost{background:transparent}
button.danger{color:var(--err)}
button.sm{padding:.25rem .6rem;font-size:.85rem}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:.45rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g-light);outline-offset:0;border-color:var(--g-light)}
.btns{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.btns.end{justify-content:flex-end;margin-top:1rem}

/* layout */
main{padding:1rem 1.1rem 4rem}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:330px 1fr;gap:1rem;align-items:start}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem;position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column}
.list-tools{display:flex;flex-direction:column;gap:.4rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.selcount{font-size:.8rem;color:var(--muted);min-height:1.2em;margin-top:.3rem}
.noms{list-style:none;margin:.3rem 0 0;padding:0;overflow:auto;flex:1}
.noms li{display:flex;gap:.5rem;align-items:flex-start;padding:.55rem .4rem;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.noms li:hover{background:rgba(92,180,31,.08)}
.noms li.on{background:rgba(2,91,64,.12)}
.noms input[type=checkbox]{width:auto;margin-top:.25rem}
.noms .nm{font-weight:600}
.noms .sub{font-size:.82rem;color:var(--muted)}
.chip{display:inline-block;font-size:.72rem;padding:.05rem .5rem;border-radius:99px;border:1px solid var(--line);margin-left:.35rem;vertical-align:middle}
.chip.Pending{background:#fff4dd;color:#7a4b00;border-color:#f0d9a6}
.chip.Approved{background:#e3f4d6;color:#245c0f;border-color:#bfe3a3}
.chip.Issued{background:#dbe9ff;color:#143c86;border-color:#b7cff7}
.chip.Rejected{background:#f2e1e1;color:#7a1f1f;border-color:#e3bcbc}
.empty{color:var(--muted);padding:1rem .4rem}
.empty.big{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:3rem 1rem;text-align:center}

.editor{min-width:0}
.cols{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:1.2rem;align-items:start}
.cols>*{min-width:0}
form,.preview{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.preview{position:sticky;top:70px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .7rem}
.f{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem}
.f>span{color:var(--muted)}
.f.wide{grid-column:1/-1}
.inl{display:flex;gap:.4rem}.inl button{white-space:nowrap}
.inl-end{display:flex;justify-content:space-between;align-items:center;margin-top:.25rem}
.actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem;position:sticky;bottom:0;background:var(--card);padding:.6rem 0 .2rem;border-top:1px solid var(--line)}
.lint{margin-top:.9rem;display:flex;flex-direction:column;gap:.3rem}
.lint div{padding:.35rem .6rem;border-radius:7px;font-size:.84rem}
.lint .warn{background:var(--warn-bg);color:var(--warn)} .lint .error{background:var(--err-bg);color:var(--err)} .lint .ok{background:rgba(92,180,31,.14);color:var(--ok)}
.aibox{grid-column:1/-1;border:1px solid var(--g-light);background:rgba(92,180,31,.08);border-radius:8px;padding:.6rem;font-size:.88rem}
.aibox .row{display:flex;gap:.6rem;align-items:flex-start;margin:.35rem 0}.aibox .row b{min-width:7rem}
.aibox .row span{flex:1}

/* certificate preview (scaled copy of the real certificate) */
.pv-wrap{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.pv-stage{transform-origin:top left}
.pvwarn{font-size:.85rem;margin:.5rem 0 0;color:var(--warn)}

/* pages */
.page{max-width:1100px;margin:0 auto}.page.narrow{max-width:760px}
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:1rem;margin:1rem 0}
legend{padding:0 .4rem;color:var(--g-dark);font-weight:600}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:.8rem;margin-top:.8rem}
.tpl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem;display:flex;flex-direction:column;gap:.45rem}
.tpl h4{margin:0}.tpl p{margin:0;font-size:.88rem;white-space:pre-wrap}
.tpl .src{font-size:.75rem;color:var(--muted)}
.tpl .src.draft{color:var(--warn)}
.prose h3{margin-top:1.4rem} .prose li{margin:.25rem 0}

/* toast, banner, dialog */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:1.2rem;background:#1b2a24;color:#fff;padding:.6rem 1rem;border-radius:9px;z-index:50;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast.err{background:var(--err)}
.issuedbar{position:fixed;left:0;right:0;bottom:0;background:var(--g-dark);color:#fff;padding:.7rem 1rem;display:flex;gap:.8rem;align-items:center;justify-content:center;z-index:40}
.issuedbar button{color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(640px,94vw);padding:1.2rem}
dialog::backdrop{background:rgba(0,0,0,.45)}

@media (max-width:1180px){
  .grid{grid-template-columns:1fr}
  .list{position:static;max-height:none}
  .noms{max-height:260px}
  .cols{grid-template-columns:1fr}
  .preview{position:static}
}
@media (max-width:560px){.fields{grid-template-columns:1fr}.tabs{order:3;width:100%;overflow:auto}}
@media print{.top,main,.toast,.issuedbar,dialog{display:none!important}}

</style>
</head>

    <div><b data-i18n="app.title"></b><small data-i18n="app.sub"></small></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="noms" class="on" data-i18n="tab.noms"></button>
    <button data-tab="templates" data-i18n="tab.templates"></button>
    <button data-tab="settings" data-i18n="tab.settings"></button>
    <button data-tab="help" data-i18n="tab.help"></button>
  </nav>
  <div class="top-right">
    <span id="syncState" class="sync"></span>
    <button id="btnSync" class="ghost" data-i18n="btn.sync"></button>
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="id">ID</button>
    </div>
  </div>
</header>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<main>
  <!-- ============ NOMINATIONS ============ -->
  <section id="tab-noms" class="tab on">
    <div class="grid">
      <aside class="list">
        <div class="list-tools">
          <input id="q" type="search" data-i18n-ph="list.search">
          <div class="row2">
            <select id="fStatus"></select>
            <select id="fIc"></select>
          </div>
          <div class="btns">
            <button id="btnAdd" class="primary" data-i18n="btn.add"></button>
            <button id="btnImport" data-i18n="btn.import"></button>
            <button id="btnScan" data-i18n="btn.scan"></button>
            <input id="scanFile" type="file" accept="image/*" hidden>
          </div>
          <div class="btns">
            <button id="btnPrintSel" data-i18n="btn.printSel"></button>
            <button id="btnPrintApproved" data-i18n="btn.printApproved"></button>
            <button id="btnExport" class="ghost" data-i18n="btn.export"></button>
          </div>
        </div>
        <div id="selCount" class="selcount"></div>
        <ul id="nomList" class="noms"></ul>
        <p id="listEmpty" class="empty" data-i18n="list.empty" hidden></p>
      </aside>

      <div class="editor" id="editor">
        <p class="empty big" id="edEmpty" data-i18n="ed.empty"></p>

        <div id="edBody" hidden>
          <div class="cols">
            <form id="form" autocomplete="off" onsubmit="return false">
              <h3 data-i18n="ed.nomination"></h3>
              <div class="fields">
                <label class="f wide"><span data-i18n="f.name"></span>
                  <div class="inl"><input id="fName"><button type="button" id="btnTidyName" class="ghost sm" data-i18n="btn.tidy"></button></div></label>
                <label class="f"><span data-i18n="f.nickname"></span><input id="fNick"></label>
                <label class="f"><span data-i18n="f.role"></span><input id="fRole"></label>
                <label class="f"><span data-i18n="f.ic"></span><select id="fIC"></select></label>
                <label class="f"><span data-i18n="f.location"></span><input id="fLoc"></label>
                <label class="f wide"><span data-i18n="f.observation"></span><textarea id="fObs" rows="2"></textarea></label>
                <label class="f wide"><span data-i18n="f.action"></span><textarea id="fAct" rows="2"></textarea></label>
                <label class="f"><span data-i18n="f.category"></span><select id="fCat"></select></label>
                <label class="f"><span data-i18n="f.nominatedBy"></span><input id="fBy"></label>
                <label class="f wide"><span data-i18n="f.photo"></span><input id="fPhoto" type="url" placeholder="https://"></label>
              </div>

              <h3 data-i18n="ed.certificate"></h3>
              <div class="fields">
                <label class="f"><span data-i18n="f.lang"></span><select id="fLang"></select></label>
                <label class="f"><span data-i18n="f.date"></span><input id="fDate" type="date"></label>
                <label class="f wide"><span data-i18n="f.template"></span><select id="fTpl"></select></label>
                <label class="f wide"><span data-i18n="f.highlight"></span>
                  <div class="inl"><input id="fHigh"><button type="button" id="btnAI" class="sm" data-i18n="btn.ai"></button></div>
                  <small class="hint" data-i18n="f.highlightHint"></small></label>
                <div id="aiBox" class="aibox" hidden></div>
                <label class="f wide"><span data-i18n="f.paragraph"></span>
                  <textarea id="fPara" rows="6"></textarea>
                  <div class="inl-end"><span id="paraCount" class="hint"></span><button type="button" id="btnRegen" class="ghost sm" data-i18n="btn.regen"></button></div></label>
                <label class="f"><span data-i18n="f.certNo"></span><input id="fNo"></label>
                <label class="f"><span data-i18n="f.status"></span><select id="fStatusSel"></select></label>
              </div>

              <div id="lintBox" class="lint"></div>

              <div class="actions">
                <button type="button" id="btnSave" data-i18n="btn.save"></button>
                <button type="button" id="btnApprove" class="primary" data-i18n="btn.approve"></button>
                <button type="button" id="btnPrint" data-i18n="btn.print"></button>
                <button type="button" id="btnIssued" data-i18n="btn.issued"></button>
                <button type="button" id="btnReject" class="ghost" data-i18n="btn.reject"></button>
                <button type="button" id="btnDelete" class="ghost danger" data-i18n="btn.delete"></button>
              </div>
            </form>

            <div class="preview">
              <h3 data-i18n="ed.preview"></h3>
              <div id="pvWrap" class="pv-wrap"><div id="pvStage" class="pv-stage"></div></div>
              <p id="pvWarn" class="pvwarn"></p>
              <p class="hint" data-i18n="print.hint"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ TEMPLATES ============ -->
  <section id="tab-templates" class="tab">
    <div class="page">
      <div class="page-head">
        <h2 data-i18n="tpl.title"></h2>
        <div class="btns">
          <button id="btnNewTpl" class="primary" data-i18n="btn.newTpl"></button>
          <button id="btnImpTpl" data-i18n="btn.importTpl"></button>
          <button id="btnExpTpl" data-i18n="btn.exportTpl"></button>
          <input id="tplFile" type="file" accept="application/json" hidden>
        </div>
      </div>
      <p class="muted"><span data-i18n="tpl.intro"></span><code>{nickname} {name} {role} {ic} {location} {highlight} {date}</code></p>
      <div id="tplList" class="tpls"></div>
    </div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="tab-settings" class="tab">
    <div class="page narrow">
      <h2 data-i18n="set.title"></h2>
      <p class="muted" data-i18n="set.note"></p>

      <fieldset><legend data-i18n="set.data"></legend>
        <label class="f wide"><span data-i18n="set.sheetUrl"></span><input id="sSheetUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
        <label class="f wide"><span data-i18n="set.sheetToken"></span><input id="sSheetToken" type="password" autocomplete="off"></label>
      </fieldset>

      <fieldset><legend data-i18n="set.ai"></legend>
        <label class="f wide"><span data-i18n="set.workerUrl"></span><input id="sWorkerUrl" placeholder="https://mentari-cert-ai.<account>.workers.dev"></label>
        <label class="f wide"><span data-i18n="set.appKey"></span><input id="sAppKey" type="password" autocomplete="off"></label>
        <div class="btns"><button id="btnTest" data-i18n="btn.test"></button></div>
      </fieldset>

      <fieldset><legend data-i18n="set.cert"></legend>
        <div class="fields">
          <label class="f"><span data-i18n="set.place"></span><input id="sPlace"></label>
          <label class="f"><span data-i18n="set.subtitle"></span><input id="sSub"></label>
          <label class="f"><span data-i18n="set.defLang"></span><select id="sDefLang"></select></label>
          <label class="f"><span data-i18n="set.certPrefix"></span><input id="sPrefix"></label>
          <label class="f"><span><span data-i18n="set.sigLeft"></span> – <span data-i18n="set.sigName"></span></span><input id="sSigLN"></label>
          <label class="f"><span><span data-i18n="set.sigLeft"></span> – <span data-i18n="set.sigTitle"></span></span><input id="sSigLT"></label>
          <label class="f"><span><span data-i18n="set.sigRight"></span> – <span data-i18n="set.sigName"></span></span><input id="sSigRN"></label>
          <label class="f"><span><span data-i18n="set.sigRight"></span> – <span data-i18n="set.sigTitle"></span></span><input id="sSigRT"></label>
        </div>
      </fieldset>

      <fieldset><legend data-i18n="set.ics"></legend>
        <label class="f wide"><span data-i18n="set.icsHelp"></span><textarea id="sIcs" rows="5"></textarea></label>
      </fieldset>

      <div class="btns"><button id="btnSaveSettings" class="primary" data-i18n="btn.saveSettings"></button></div>
    </div>
  </section>

  <!-- ============ HELP ============ -->
  <section id="tab-help" class="tab">
    <div class="page narrow prose" id="helpBody"></div>
  </section>
</main>

<!-- certificates are rendered here for printing -->
<div id="printRoot"></div>

<!-- after-print banner -->
<div id="issuedBar" class="issuedbar" hidden>
  <span id="issuedMsg"></span>
  <button id="btnIssuedYes" class="primary" data-i18n="btn.yes"></button>
  <button id="btnIssuedNo" data-i18n="btn.no"></button>
</div>

<!-- import dialog -->
<dialog id="dlgImport">
  <h3 data-i18n="imp.title"></h3>
  <p class="muted" data-i18n="imp.help"></p>
  <label class="f wide"><span data-i18n="imp.file"></span><input id="impFile" type="file" accept=".csv,.tsv,.txt"></label>
  <label class="f wide"><span data-i18n="imp.paste"></span><textarea id="impText" rows="8"></textarea></label>
  <div class="btns end"><button id="impCancel" data-i18n="btn.cancel"></button><button id="impGo" class="primary" data-i18n="btn.doImport"></button></div>
</dialog>

<!-- template dialog -->
<dialog id="dlgTpl">
  <h3 id="tplDlgTitle"></h3>
  <div class="fields">
    <label class="f"><span data-i18n="tpl.name"></span> (ID)<input id="tNameId"></label>
    <label class="f"><span data-i18n="tpl.name"></span> (EN)<input id="tNameEn"></label>
    <label class="f wide"><span data-i18n="tpl.category"></span><select id="tCat"></select></label>
    <label class="f wide"><span data-i18n="tpl.textId"></span><textarea id="tTextId" rows="6"></textarea></label>
    <label class="f wide"><span data-i18n="tpl.textEn"></span><textarea id="tTextEn" rows="6"></textarea></label>
  </div>
  <div class="btns end"><button id="tplCancel" data-i18n="btn.cancel"></button><button id="tplSave" class="primary" data-i18n="btn.save"></button></div>
