<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EcoOils HSSE Recognition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,600;1,700&family=Arvo:wght@700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#231f20;--mut:#6e6b6c;--line:#dcdcdc;--bg:#f6f6f5;--card:#fff;--green:#44a276;--gdark:#025b40;--glight:#5cb41f;--navy:#002060;--yellow:#fbce07;--red:#dd1d21;--warn:#8a5a00;--warnbg:#fff4d6;--errbg:#fde8e8;--ok:#1d6b2a;--okbg:#e6f4dc}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{font:400 15px/1.45 Jost,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
header.eh{background:#fff;padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
header.eh .logo{height:48px;width:auto;max-width:58%;display:block}
.eh-r{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto}
.eh-v{font-size:12px;letter-spacing:.08em;color:var(--mut);line-height:1.2;padding-top:2px;font-variant-numeric:tabular-nums}
.eh-d{font-size:11px;letter-spacing:.06em;color:#aaa;line-height:1.2;padding-top:2px}
.lang{display:flex}.lang button{background:none;border:0;border-bottom:3px solid transparent;min-width:44px;min-height:40px;padding:0 8px;font:400 15px/1 Jost,sans-serif;letter-spacing:.06em;color:var(--mut);cursor:pointer}
.lang button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}
.titlebar{padding:18px 16px 4px;max-width:1180px;margin:0 auto}
h1.pt{margin:0;font:300 24px/1.2 Jost,sans-serif;text-transform:uppercase;letter-spacing:.22em;color:#6e6b6c}
.sub{color:var(--mut);font-size:13px;letter-spacing:.06em;margin-top:2px}
nav.tabs{display:flex;gap:2px;max-width:1180px;margin:8px auto 0;padding:0 10px;border-bottom:1px solid var(--line);overflow:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;color:var(--mut);letter-spacing:.06em;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--green)}
main{max-width:1180px;margin:0 auto;padding:16px 12px 80px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font:600 13px/1.2 Jost,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--gdark)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.grid>*{min-width:0}.grid .w{grid-column:1/-1}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g6 .s2{grid-column:span 2}.g6 .s3{grid-column:span 3}.g6 input,.g6 select{width:100%}
@media(max-width:700px){.g6{grid-template-columns:1fr 1fr}.g6 .s2,.g6 .s3{grid-column:auto}}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
label.f b{color:var(--red);font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #c9c9c9;border-radius:8px;background:#fff;color:var(--ink);font-size:15px}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
button.btn{background:#fff;border:1px solid #bdbdbd;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
button.btn:hover{border-color:var(--gdark)}
button.btn.pri{background:var(--gdark);border-color:var(--gdark);color:#fff}
button.btn.yel{background:var(--yellow);border-color:var(--yellow);color:#231f20;font-weight:600}
button.btn.ghost{background:transparent}button.btn.danger{color:var(--red)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}
.hint{font-size:12.5px;color:var(--mut)}
.box{border-radius:8px;padding:10px 12px;font-size:14px;margin:8px 0}
.box.info{background:#eef6f1;border:1px solid #cfe5d8}.box.warn{background:var(--warnbg);color:var(--warn)}.box.err{background:var(--errbg);color:#8d1c1c}.box.ok{background:var(--okbg);color:var(--ok)}
.box ul{margin:4px 0 0 18px;padding:0}
.crit{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:6px}.crit span{font-size:14px}
@media(max-width:620px){.crit{grid-template-columns:1fr}}
.dz{border:2px dashed #b9c9c0;border-radius:10px;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);cursor:pointer;padding:10px;background:#fafcfb}
.dz.over{border-color:var(--green);background:#eef6f1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{position:relative;width:104px;height:104px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.th.add{display:flex;align-items:center;justify-content:center;border:2px dashed #b9c9c0;font-size:34px;color:var(--mut);cursor:pointer;background:#fafcfb}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:50%;font-weight:700;font-size:20px;color:#fff}
.score.hi{background:var(--glight)}.score.mid{background:#e5a100}.score.lo{background:var(--red)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff}
.cmp small{display:block;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
#peek{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#peek img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#231f20;color:#fff;padding:10px 16px;border-radius:9px;z-index:80;max-width:92vw}
.toast.err{background:var(--red)}
.pill{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;border:1px solid var(--line);letter-spacing:.04em}
.pill.Pending{background:#fff4d6;color:#7a4b00}.pill.Approved{background:#e3f4d6;color:#245c0f}.pill.Issued{background:#dbe9ff;color:#143c86}.pill.Rejected{background:#f2e1e1;color:#7a1f1f}
.adm{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.adm>*{min-width:0}
@media(max-width:1000px){.adm{grid-template-columns:minmax(0,1fr)}}
.list{max-height:70vh;overflow:auto;margin:8px 0 0;padding:0;list-style:none}
.list li{display:flex;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.list li:hover{background:#f1f7f3}.list li.on{background:#e3f0e8}
.list input[type=checkbox]{width:auto;margin-top:4px}
.list .n{font-weight:600}.list .s{font-size:12.5px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid #bdbdbd;border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;padding:7px 14px;cursor:pointer}.seg button.on{background:var(--gdark);color:#fff}
.pv{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.pv .stage{transform-origin:top left}
table.wk{border-collapse:collapse;width:100%;font-size:14px}table.wk th,table.wk td{border:1px solid var(--line);padding:7px 9px;text-align:center}table.wk th{background:#f1f1ef;font-weight:500}
table.wk td.zero{color:#aaa}table.wk td.cur.zero{background:var(--errbg);color:#8d1c1c;font-weight:600}table.wk td.cur{background:var(--okbg)}
.issuedbar{position:fixed;left:0;right:0;bottom:0;background:var(--gdark);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:70;flex-wrap:wrap}
.issuedbar .btn{color:#231f20}
.ph{display:flex;gap:8px}.ph select{width:auto;max-width:44%}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}

/* certificate + card (print artwork) — 1em = 1% of page width */
.cert,.gj{position:relative;width:297mm;height:209.6mm;background:#fff;overflow:hidden;font-family:Jost,'Century Gothic',sans-serif;font-size:2.97mm;color:var(--navy);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cert *,.gj *{box-sizing:border-box;margin:0;padding:0}
.cert .bg{position:absolute;inset:0;width:100%;height:100%}
.cert .logo{position:absolute;left:65.5%;top:4.6%;width:30.5%}
.cert .ttl{position:absolute;left:6.6%;top:20.6%;font:700 6.1em/1 Arvo,Rockwell,serif;letter-spacing:.05em;color:var(--gdark);white-space:nowrap}
.cert .st{position:absolute;left:6.7%;top:31.4%;font-size:3.08em;line-height:1;letter-spacing:.36em;color:var(--gdark);white-space:nowrap}
.cert .lb{position:absolute;left:6.7%;top:38%;font-size:1.8em;letter-spacing:.06em;color:var(--gdark);white-space:nowrap}
.cert .nm{position:absolute;left:6.7%;top:42.2%;width:72%;height:8.6%;display:flex;align-items:flex-end;font-weight:700;font-size:4.1em;line-height:1.1;white-space:nowrap;overflow:hidden}
.cert .rule{position:absolute;left:6.7%;top:51.3%;width:70.5%;border-top:.22em solid var(--glight)}
.cert .meta{position:absolute;left:6.7%;top:52.3%;width:70.5%;display:flex;justify-content:space-between;gap:2em;font-size:1.75em;line-height:1.2;color:var(--gdark);font-weight:500}
.cert .body{position:absolute;left:6.6%;top:57.2%;width:80%;height:20.5%;font-size:2.05em;line-height:1.28;overflow:hidden}
.cert .body .wrap{float:right;width:8%;height:100%;shape-outside:polygon(100% 0,100% 66%,15% 100%,100% 100%);shape-margin:1.6em}
.cert .body p{margin:0 0 .55em;text-align:justify}@font-face{font-family:'Amalfi';src:url('fonts/AmalfiCoast.ttf') format('truetype');font-display:swap}
.cert .hand{position:absolute;left:58%;width:31%;bottom:12.8%;height:14.6%;display:flex;align-items:flex-end;justify-content:flex-start;text-align:left;font-family:'Amalfi','Caveat','Segoe Script',cursive;font-size:1.85em;line-height:1.3;color:#0824aa;overflow:hidden;z-index:3;mix-blend-mode:multiply}
.cert .hand span{display:block}
.cert .body p.pers{font-size:8pt;font-weight:400;font-style:italic;line-height:1.3}
.cert .sig{position:absolute;top:86.6%;width:24.85%;text-align:center}.cert .sig.l{left:5.54%}.cert .sig.r{left:44.77%}
.cert .sig{z-index:1}.cert .sig .sigimg{position:absolute;left:50%;top:-6.2em;transform:translateX(-72%);height:11.6em;width:auto;max-width:none;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;z-index:2}
.cert .sig .ln{border-top:.3em solid #008000;margin-bottom:.3em}.cert .sig .sn{font-size:1.9em;line-height:1.2}.cert .sig .sj{font-size:2.05em;line-height:1.2;font-weight:700;font-style:italic}
.cert .disc{position:absolute;left:21%;width:76%;bottom:.2%;height:2.6%;display:flex;align-items:center;white-space:nowrap;overflow:hidden;font-size:.8em;line-height:1.15;color:#fff;opacity:.95}
.cert .qr{position:absolute;left:88.4%;top:70.5%;width:8.4%;background:#fff;border-radius:.5em;padding:.5em .5em .35em;text-align:center;box-shadow:0 0 0 .12em #d8e2dc}
.cert .qr svg{display:block;width:100%;height:auto}.cert .qr span{display:block;font-size:.62em;line-height:1.15;color:var(--gdark);letter-spacing:.04em;margin-top:.3em}
.vbadge{font-size:1.25rem;font-weight:600;padding:12px 14px;border-radius:8px;margin-bottom:12px}.vbadge.ok{background:#e6f4ea;color:#0b6b33}.vbadge.bad{background:#fdeaea;color:#a61b1b}
#verifyPage dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 10px}#verifyPage dt{color:var(--mut)}#verifyPage dd{margin:0;font-weight:600}
.cert .no{position:absolute;left:6.7%;bottom:.15%;height:3%;display:flex;align-items:center;font-size:1.05em;letter-spacing:.08em;color:#fff;opacity:.9}
.gj{border:0}.gj .frame{position:absolute;inset:3.2%;border:.35em solid var(--navy);padding:1.6em 2.2em}
.gj .top{display:flex;justify-content:space-between;align-items:flex-start}.gj .top img{width:16em}
.gj .stamp{width:12.5em;height:12.5em}
.gj .ttl{font:300 2.6em/1.1 Jost,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#6e6b6c}
.gj .ph2{display:grid;grid-template-columns:1fr 1fr;gap:1.6em;margin-top:1.2em}
.gj .ph2 figure{position:relative;height:20em;border:.15em solid var(--line);background:#f2f2f2}
.gj .ph2 img{width:100%;height:100%;object-fit:cover;display:block}
.gj .ph2 figcaption{position:absolute;left:0;top:0;background:var(--navy);color:#fff;font-weight:600;font-size:1.5em;letter-spacing:.14em;padding:.2em .7em}
.gj .ph2 .blank{display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:1.3em}
.gj .who{margin-top:1.1em;display:flex;justify-content:space-between;align-items:flex-end;gap:2em}
.gj .who h3{font:700 3.2em/1.1 Jost,sans-serif;text-transform:uppercase}.gj .who p{font-size:1.7em;color:var(--mut);font-weight:500}
.gj .txt{margin-top:1em;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em}
.gj .txt div{border:.2em solid #1fa14a;padding:.7em .9em;font-size:1.55em;line-height:1.3;height:11.5em;overflow:hidden}
.gj .txt b{display:block;font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--gdark);margin-bottom:.25em}
.gj .foot{position:absolute;left:2.2em;right:2.2em;bottom:.9em;display:flex;justify-content:space-between;font-size:1.2em;color:var(--mut)}
#printRoot{display:none}
@page{size:A4 landscape;margin:0}
@media print{html,body{margin:0!important;background:#fff!important}body>*:not(#printRoot){display:none!important}#printRoot{display:block!important}#printRoot .cert,#printRoot .gj{page-break-after:always;break-after:page;height:209.6mm}#printRoot>*:last-child{page-break-after:auto;break-after:auto}}
#handOpts{margin-top:4px;border:1px solid var(--line,#ddd);border-radius:8px;padding:4px 8px}#handOpts .hopt{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:8px;padding:3px 0;margin:0;font-size:13px;line-height:1.3;cursor:pointer}#handOpts .hopt input{width:auto!important;min-width:0;height:auto;margin:2px 0 0;padding:0;flex:0 0 auto}#handOpts .hopt .hen{display:block;font-size:11.5px;color:#6b7280;font-style:italic;margin-top:1px}#handOpts .hopt span{flex:1 1 auto;display:block;margin:0;font-size:13px}
</style>
</head>
<body>
<header class="eh">
  <img class="logo" id="logo" alt="EcoOils Mentari" src="">
  <div class="eh-r"><div class="eh-v" id="ver">v2.4.0</div>
    <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="id">ID</button><button data-l="ms">MS</button></div>
    <div class="eh-d" id="verdate"></div></div>
</header>
<div class="titlebar"><h1 class="pt" data-i="app.title"></h1><div class="sub">Sei Mangkei</div></div>
<nav class="tabs" id="tabs"><button data-t="nominate" class="on" data-i="tab.nominate"></button><button data-t="admin" data-i="tab.admin"></button><button data-t="help" data-i="tab.help"></button></nav>

<main>
<div id="noapi" class="box warn" hidden>
  <b data-i="api.missing"></b>
  <div class="row" style="margin-top:6px"><input id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1;min-width:220px"><button class="btn" id="apiSave" data-i="btn.save"></button></div>
</div>

<!-- ===================== NOMINATE ===================== -->
<section id="tab-nominate" class="tab on">
 <div id="formWrap">
  <div class="card"><h2 data-i="n.standard"></h2>
    <p style="margin:0 0 6px" data-i="n.standardText"></p>
    <div class="crit"><span data-i="c.1"></span><span data-i="c.2"></span><span data-i="c.3"></span><span data-i="c.4"></span></div>
    <div class="box info" style="margin-bottom:0"><b data-i="n.notEnough"></b><div data-i="n.example"></div></div>
  </div>

  <div class="card"><h2 data-i="n.nominee"></h2>
   <div class="grid">
    <label class="f w"><span><span data-i="f.name"></span> <b>*</b></span><input id="f_name" maxlength="120" autocomplete="off"></label>
    <label class="f"><span data-i="f.nick"></span><input id="f_nick" maxlength="60"></label>
    <label class="f"><span><span data-i="f.role"></span> <b>*</b></span><select id="f_role"></select><input id="f_role2" maxlength="120" style="margin-top:6px" data-ph="ph.otherPos" hidden></label>
    <label class="f"><span><span data-i="f.level"></span> <b>*</b></span><select id="f_lv"></select></label>
    <div class="box warn w" id="lvNote" hidden></div>
    <label class="f"><span><span data-i="f.ic"></span> <b>*</b></span><select id="f_ic"></select><input id="f_ic2" maxlength="60" style="margin-top:6px" data-ph="ph.otherCo" hidden></label>
    <label class="f"><span><span data-i="f.location"></span> <b>*</b></span><select id="f_loc"></select><input id="f_loc2" maxlength="120" style="margin-top:6px" data-ph="ph.otherLoc" hidden></label>
    <label class="f"><span><span data-i="f.date"></span> <b>*</b></span><input id="f_date" type="date"></label>
    <label class="f"><span data-i="f.category"></span><select id="f_cat"></select></label>
   </div>
  </div>

  <div class="card"><h2 data-i="n.what"></h2>
   <div class="grid">
    <label class="f w"><span><span data-i="f.obs"></span> <b>*</b></span><textarea id="f_obs" maxlength="1500" data-ph="ph.obs"></textarea><small class="hint" id="c_obs"></small></label>
    <label class="f w"><span><span data-i="f.act"></span> <b>*</b></span><textarea id="f_act" maxlength="1500" data-ph="ph.act"></textarea><small class="hint" id="c_act"></small></label>
    <label class="f w"><span><span data-i="f.out"></span> <b>*</b></span><textarea id="f_out" maxlength="1000" data-ph="ph.out"></textarea><small class="hint" id="c_out"></small></label>
   </div>
  </div>

  <div class="card"><h2 data-i="n.photos"></h2>
   <p class="hint" style="margin:0 0 8px" data-i="n.photoHint"></p>
   <div class="grid">
    <div><b data-i="p.before"></b> <b style="color:var(--red)">*</b><div id="pb_before"></div></div>
    <div><b data-i="p.after"></b> <b style="color:var(--red)">*</b><div id="pb_after"></div></div>
   </div>
  </div>

  <div class="card"><h2 data-i="n.nominator"></h2>
   <div class="grid">
    <label class="f"><span><span data-i="f.nomName"></span> <b>*</b></span><input id="f_nn" maxlength="120"></label>
    <label class="f"><span><span data-i="f.nomRole"></span> <b>*</b></span><select id="f_nr"></select></label>
    <label class="f"><span data-i="f.nomIC"></span><select id="f_nic"></select></label>
    <label class="f"><span data-i="f.phone"></span><div class="ph"><select id="f_cc"></select><input id="f_ph" inputmode="tel" maxlength="20"></div>
      <input id="f_cc2" placeholder="+__" maxlength="6" style="margin-top:6px;max-width:120px" hidden><small class="hint" id="ccNote" hidden data-i="f.ccOther"></small></label>
   </div>
   <div class="hp"><label>Website<input id="f_web" tabindex="-1" autocomplete="off"></label></div>
  </div>

  <div class="card"><h2 data-i="n.review"></h2>
   <div id="rules"></div><div id="qc"></div>
   <div class="row" style="margin-top:12px"><button class="btn pri" id="btnFix" data-i="btn.fix"></button><button class="btn yel" id="btnQuick" data-i="btn.quick"></button><span class="hint" id="aiHint" data-i="ai.hint"></span></div>
   <div id="aiOut"></div>
   <div class="row end" style="margin-top:12px"><button class="btn pri" id="btnSubmit" disabled data-i="btn.submit"></button></div>
   <div id="gate" class="hint" style="text-align:right"></div>
  </div>
 </div>
 <div id="doneWrap" class="card" hidden>
  <h2 data-i="done.title"></h2><p id="doneMsg"></p><button class="btn pri" id="btnNew" data-i="btn.new"></button>
 </div>
</section>

<!-- ===================== ADMIN ===================== -->
<section id="tab-admin" class="tab">
 <div id="loginWrap" class="card" style="max-width:460px">

'help':['<h2>How it works</h2><p>• Anyone can nominate: crew, supervisors, IC HSSE and the Mentari HSSE team. HSSE Managers submit at least one nomination every week.</p><p>• Both a Before and an After photo are required, plus the observation, the action and the outcome.</p><p>• An instant quality check (no AI needed) scores the nomination against the four points and tells you what is missing. A nomination below 6 out of 10 cannot be submitted.</p><p>• Optional: AI can rewrite the wording more clearly in English and Bahasa Indonesia. It never looks at the photos.</p><p>• HSSE reviews each nomination, edits the wording if needed, approves it, then prints the certificate (Bahasa Indonesia) and the Great Job card.</p><p>• The strongest nominations go forward to the EcoOils HSSE Bulletin.</p>','<h2>Cara kerja</h2><p>• Semua orang bisa menominasikan: kru, supervisor, HSSE IC dan tim HSSE Mentari. Manajer HSSE mengirim minimal satu nominasi setiap minggu.</p><p>• Foto Sebelum dan Sesudah wajib, ditambah observasi, tindakan dan hasil.</p><p>• Pemeriksaan kualitas instan (tanpa AI) menilai nominasi terhadap empat poin dan memberi tahu apa yang kurang. Nominasi di bawah 6 dari 10 tidak bisa dikirim.</p><p>• Opsional: AI dapat menulis ulang kalimat agar lebih jelas dalam Bahasa Indonesia dan Inggris. AI tidak pernah melihat foto.</p><p>• HSSE meninjau, mengedit kalimat bila perlu, menyetujui, lalu mencetak sertifikat (Bahasa Indonesia) dan kartu Great Job.</p><p>• Nominasi terbaik diteruskan ke Buletin HSSE EcoOils.</p>','<h2>Cara ia berfungsi</h2><p>• Sesiapa boleh mencalonkan: krew, penyelia, HSSE IC dan pasukan HSSE Mentari. Pengurus HSSE menghantar sekurang-kurangnya satu pencalonan setiap minggu.</p><p>• Gambar Sebelum dan Selepas diperlukan, serta pemerhatian, tindakan dan hasil.</p><p>• Semakan kualiti segera (tanpa AI) menilai pencalonan berdasarkan empat perkara dan memberitahu apa yang kurang. Pencalonan di bawah 6 daripada 10 tidak boleh dihantar.</p><p>• Pilihan: AI boleh menulis semula ayat dengan lebih jelas dalam Bahasa Indonesia dan Inggeris. AI tidak pernah melihat gambar.</p><p>• HSSE menyemak, menyunting ayat jika perlu, meluluskan, kemudian mencetak sijil (Bahasa Indonesia) dan kad Great Job.</p><p>• Pencalonan terbaik diteruskan ke Buletin HSSE EcoOils.</p>']

function applyLang(){
  document.documentElement.lang = LANG;
  $$('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  $$('[data-i]').forEach(e => { const v = t(e.dataset.i); if (e.dataset.i === 'help') e.innerHTML = v; else e.textContent = v; });
  $$('[data-ph]').forEach(e => e.placeholder = t(e.dataset.ph));
  $('#helpBody').innerHTML = t('help');
  fillSelects(); renderRules(); renderGate(); if (aiState.result) renderAI(); renderPhotoBoxes();
  if (typeof renderList === 'function') { renderList(); renderWeekly(); if (cur) renderPreview(); }
  $('#issYes').textContent = m('yesB'); $('#issNo').textContent = m('noB');
}

/* ---------- helpers ---------- */
let toastT;
function toast(msg, err){ const e = $('#toast'); e.textContent = msg; e.className = 'toast' + (err ? ' err' : ''); e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => e.hidden = true, 4500); }
function apiUrl(){ return API_URL || localStorage.getItem('rec_api') || new URLSearchParams(location.search).get('api') || ''; }
async function api(body, ms){
  const u = apiUrl(); if (!u) throw new Error('NOAPI');
  const ac = new AbortController(), tm = ms ? setTimeout(() => ac.abort(), ms) : 0;
  try {
    const r = await fetch(u, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), signal:ac.signal});
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Error'); return j;
  } finally { clearTimeout(tm); }
}
function readImg(file, max, q){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width * s), h = Math.round(im.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h); res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file); });
}
function peek(src){ const p = $('#peek'); p.querySelector('img').src = src; p.hidden = false; }
$('#peek').addEventListener('click', () => $('#peek').hidden = true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#peek').hidden = true; });
function isoWeek(d){ const t0 = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t0.getUTCDay() || 7; t0.setUTCDate(t0.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t0.getUTCFullYear(), 0, 1)); const w = Math.ceil(((t0 - y0) / 86400000 + 1) / 7); return t0.getUTCFullYear() + '-W' + String(w).padStart(2, '0'); }
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function fmtDate(iso, lang){ if (!iso) return ''; const d = new Date(String(iso).slice(0, 10) + 'T12:00:00'); if (isNaN(d)) return iso; return d.toLocaleDateString({id:'id-ID', en:'en-GB', ms:'ms-MY'}[lang] || 'en-GB', {day:'numeric', month:'long', year:'numeric'}); }

/* ---------- photo boxes ---------- */
const PB = {before:[], after:[]};
function renderPhotoBox(kind){
  const root = $('#pb_' + kind), items = PB[kind];
  root.innerHTML = '';
  if (!items.length) {
    const dz = document.createElement('div'); dz.className = 'dz'; dz.textContent = t('p.drop'); root.appendChild(dz);
    wireDrop(dz, kind);
  } else {
    const th = document.createElement('div'); th.className = 'thumbs';
    items.forEach((it, i) => { const d = document.createElement('div'); d.className = 'th'; d.innerHTML = `<img alt=""><button type="button" aria-label="remove">×</button>`; d.querySelector('img').src = it.full;
      d.querySelector('img').onclick = () => peek(it.full);
      d.querySelector('button').onclick = e => { e.stopPropagation(); items.splice(i, 1); renderPhotoBox(kind); changed(); }; th.appendChild(d); });
    if (items.length < 3) { const a = document.createElement('div'); a.className = 'th add'; a.textContent = '+'; th.appendChild(a); wireDrop(a, kind); }
    root.appendChild(th);
  }
}
function wireDrop(el, kind){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.hidden = true; el.appendChild(inp);
  el.addEventListener('click', e => { if (e.target !== inp) inp.click(); });
  inp.addEventListener('change', () => addFiles(kind, inp.files));
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); addFiles(kind, e.dataTransfer.files); });
}
async function addFiles(kind, files){
  for (const f of [...files]) { if (PB[kind].length >= 3) break; if (!/^image\//.test(f.type)) continue;
    try { PB[kind].push({full: await readImg(f, 1280, .8), small: await readImg(f, 640, .6)}); } catch (e) { toast('Photo error', true); } }
  renderPhotoBox(kind); changed();
}
function renderPhotoBoxes(){ renderPhotoBox('before'); renderPhotoBox('after'); }

const FIELDS = {name:'#f_name', nick:'#f_nick', role:'#f_role', level:'#f_lv', ic:'#f_ic', location:'#f_loc', eventDate:'#f_date', category:'#f_cat', observation:'#f_obs', action:'#f_act', outcome:'#f_out', nomName:'#f_nn', nomRole:'#f_nr', nomIC:'#f_nic'};
const aiState = {fp:'', result:null, down:false};
function vals(){ const o = {}; for (const k in FIELDS) o[k] = $(FIELDS[k]).value.trim(); if (o.location === '__other') o.location = $('#f_loc2').value.trim(); if (o.ic === 'OTHER') o.ic = $('#f_ic2').value.trim(); if (o.role === 'OTHER') o.role = $('#f_role2').value.trim(); return o; }
function phoneVal(){ const n = $('#f_ph').value.replace(/[^\d]/g, ''); if (!n) return ''; const cc = $('#f_cc').value; if (cc === 'OTHER') { const c = ($('#f_cc2').value || '').trim(); return '[UNCONFIRMED ' + (c || '+?') + '] ' + n; } return cc + ' ' + n; }
function fp(){ const v = vals(); return JSON.stringify([v.name, v.role, v.ic, v.location, v.observation, v.action, v.outcome, PB.before.length, PB.after.length]); }
const RX = {
 hazard: /(\b(hazard|unsafe|risk|missing|damag|loose|leak|spill|expos|trip|fall|slip|uncover|without|broken|block|unguard|defect|danger|fire|electri|collaps|overload|scatter|left|debris|scrap|obstruct)|bahaya|tidak aman|risiko|rusak|rosak|bocor|tumpah|terbuka|terdedah|licin|tersandung|terjatuh|jatuh|tanpa|tidak ada|tiada|hilang|longgar|menghalang|terhalang|kabel|korsleting|roboh|berserakan|berselerak|tercecer|sisa|ceceran|berantakan|kotor|lubang|tajam)/i,
 act: /(\b(stopp|report|inform|fix|install|replac|remov|clean|collect|secur|barricad|isolat|tagg|correct|repair|mov|cover|block|adjust|check|warn|remind|inspect|fitted|tied|mark|cordon|tighten|label|relocat|clear|organi[sz]|sweep|dispos|escalat|interven|tidied|stack)|henti|lapor|perbaik|baiki|betul|pasang|ganti|bersih|kumpul|amankan|tutup|pindah|buang|isolasi|tanda|ingat|tegur|periksa|semak|cek|rapi|singkir|ikat|pagar|tempel|susun|beritahu)/i,
 fix: /(\b(correct|fix|resolv|prevent|remov|clear|secur|restor|replac|clos|repair|eliminat|avoid|clean|tidied|reinstall|barricad|isolat|cover|install|safe)|perbaik|baiki|betul|atasi|cegah|hilang|bersih|aman|selamat|pulih|ganti|tutup|hindar|elak|selesai|pasang|singkir|rapi|isolasi|pagar|kumpul|buang)/i,
 res: /(\b(safe|safer|clear|prevent|avoid|no one|nobody|reduc|improv|resolv|resum|continu|before|after|so that|ensur|eliminat|restor|clean|secure|free of)|aman|selamat|bersih|tidak ada|tiada|tidak terjadi|terhindar|mencegah|dicegah|dielak|berkurang|lancar|dilanjutkan|diteruskan|sebelum|sehingga|jadi|memastikan|dipastikan|menghilangkan|pulih|rapi|teratasi|terkendali)/i
};
function rulesErrors(){
  const v = vals(), e = [];
  if (!v.name || !v.role || !v.ic || !v.location || !v.eventDate || !v.observation || !v.action || !v.outcome || !v.nomName || !v.nomRole) e.push(m('rReq'));
  if (v.observation.length < 40 || v.action.length < 40 || v.outcome.length < 25) e.push(m('rShort'));
  if (!PB.before.length || !PB.after.length) e.push(m('rPhoto'));
  else if (PB.before[0].full === PB.after[0].full) e.push(m('rSame'));
  return e;
}
/* Instant quality check, runs in the browser: no AI, no network. It checks that the nomination tells the whole story. */
const BEYOND = /(stop work|stop[- ]work authority|stopped (the |a |an |their |his |her )?(work|job|task|crew|operation|activity|lift|excavation)|halted|beyond|outside (his|her|their|the)|not (his|her|their|in (his|her|their)) (area|scope|duty|job)|volunteer|own initiative|on (his|her) own|unprompted|without being (asked|told)|proactive|inisiatif|sendiri|di luar|melampaui|tanpa diminta|tanpa disuruh|menghentikan|hentikan|stop kerja|luar tugas|inisiatif sendiri|atas inisiatif)/i;
function analyze(){ const v = vals(); return scoreNom(v.observation, v.action, v.outcome, !!(PB.before.length && PB.after.length && PB.before[0].full !== PB.after[0].full), v.level); }
function scoreNom(o, a, u, photos, level){
  const all = o + ' ' + a + ' ' + u;
  const crit = {
    hazard_identified: o.length >= 60 && RX.hazard.test(o),
    ownership: a.length >= 50 && RX.act.test(a),
    corrected: a.length >= 50 && u.length >= 25 && RX.fix.test(a + ' ' + u),
    outcome: u.length >= 25 && RX.res.test(u)
  };
  const spec = all.length >= 180;
  const generic = GENERIC.test(all) && all.length < 400;
  let score = (crit.hazard_identified ? 2 : 0) + (crit.ownership ? 2 : 0) + (crit.corrected ? 2 : 0) + (crit.outcome ? 2 : 0) + (spec ? 1 : 0) + (photos ? 1 : 0);
  if (generic) score = Math.max(0, score - 3);
  const tips = []; if (generic) tips.push('generic');
  ['hazard_identified', 'ownership', 'corrected', 'outcome'].forEach(k => { if (!crit[k]) tips.push(k); }); if (!spec) tips.push('spec');
  const beyond = (!level || level === 'crew') ? null : BEYOND.test(all);
  return {score, verdict: score >= 8 ? 'strong' : score >= 6 ? 'needs_work' : 'weak', crit, spec, photos, generic, tips, beyond};
}
function renderQC(){
  const el = $('#qc'); if (!el) return;
  const v = vals(); if (!v.observation && !v.action && !v.outcome) { el.innerHTML = ''; return; }
  const q = analyze(), cls = q.score >= 8 ? 'hi' : q.score >= 6 ? 'mid' : 'lo';
  const tick = (ok, k) => `<span>${ok ? '✓' : '✗'} ${esc(m('crit', k))}</span>`;
  const tips = q.tips.map(k => k === 'generic' ? m('generic') : m('tip', k));
  el.innerHTML = `<div class="row" style="margin:6px 0"><span class="score ${cls}">${q.score}</span><b>${esc(m('verdict', q.verdict))}</b></div>
   <div class="crit">${tick(q.crit.hazard_identified, 'hazard_identified')}${tick(q.crit.ownership, 'ownership')}${tick(q.crit.corrected, 'corrected')}${tick(q.crit.outcome, 'outcome')}${tick(q.spec, 'spec')}${tick(q.photos, 'photos')}</div>
   ${tips.length ? `<div class="box warn"><ul>${tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}`;
}

/* Instant fix: runs in the browser with textfix.js. No AI, no internet. */
function runFix(){
  const v = vals(); if (!v.observation || !v.action || !v.outcome) { toast(m('rReq'), true); return; }
  if (!window.TextFix) { toast(m('aiOff'), true); return; }
  const r = TextFix.fixAll({observation:v.observation, action:v.action, outcome:v.outcome});
  if (!r.count) { aiState.result = null; aiState.fp = ''; renderAI(); toast(m('fixNone')); return; }
  aiState.result = {quick:true, rephrased:r.text, issues:[]}; aiState.fp = fp(); aiState.down = false;
  renderAI(); toast(m('fixDone').replace('{n}', r.count));
}
async function runAI(mode){
  const v = vals(); if (!v.observation || !v.action || !v.outcome) { toast(m('rReq'), true); return; }
  const quick = mode === 'quick', bq = $('#btnQuick'), bf = {}, pressed = bq;
  bq.disabled = bf.disabled = true; pressed.textContent = quick ? m('aiQuick') : m('aiBusy');
  try {
    let cid = localStorage.getItem('rec_cid'); if (!cid) { cid = Math.random().toString(36).slice(2); localStorage.setItem('rec_cid', cid); }
    const j = await api({action:'ai', mode: quick ? 'quick' : 'full', client:cid, fields:v}, 45000);   /* text only: photos are never sent to AI */
    aiState.result = quick ? {quick:true, rephrased:j.result, issues:j.result.issues || []} : j.result; aiState.fp = fp(); aiState.down = false;
  } catch (e) {
    if (e.message === 'NOAPI') { $('#noapi').hidden = false; toast(t('api.missing'), true); }
    else { aiState.result = null; aiState.down = true; console.warn('AI:', e.message); toast(m('aiOff'), true); }
  }
  bq.disabled = bf.disabled = false; bq.textContent = t('btn.quick'); renderAI(); renderGate();
}
function renderAI(){
  const o = $('#aiOut'), r = aiState.result; if (!r) { o.innerHTML = ''; return; }
  const imp = r.improved || {}, pick = r.quick ? r.rephrased : ((LANG === 'en') ? imp.en : imp.id);
  o.innerHTML = `${(r.issues || []).length ? `<div class="box warn"><b>${esc(m('issues'))}</b><ul>${r.issues.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}

  const u = $('#btnUse'); if (u) u.onclick = () => { $('#f_obs').value = pick.observation; $('#f_act').value = pick.action; $('#f_out').value = pick.outcome; aiState.fp = ''; changed(); };
}

  $('#apiSave').onclick = () => { const v = $('#apiUrl').value.trim(); if (/^https:\/\/script\.google\.com\/macros\/s\/[^ ]+\/exec$/.test(v)) { localStorage.setItem('rec_api', v); $('#noapi').hidden = true; toast(m('saved')); } else toast('URL?', true); };
  $('#f_date').value = todayISO(); $('#f_date').max = todayISO();
  applyLang(); loadDraft();
  Object.values(FIELDS).forEach(s => $(s).addEventListener('input', changed)); Object.values(FIELDS).forEach(s => $(s).addEventListener('change', changed));
  ['#f_loc2', '#f_ic2', '#f_role2'].forEach(s => $(s).addEventListener('input', changed));
  $('#f_loc').addEventListener('change', () => { $('#f_loc2').hidden = $('#f_loc').value !== '__other'; });
  $('#f_role').addEventListener('change', () => { $('#f_role2').hidden = $('#f_role').value !== 'OTHER'; });
  $('#f_ic').addEventListener('change', () => { $('#f_ic2').hidden = $('#f_ic').value !== 'OTHER'; });
  $('#f_cc').onchange = () => { const o = $('#f_cc').value === 'OTHER'; $('#f_cc2').hidden = !o; $('#ccNote').hidden = !o; };
  $('#btnFix').onclick = runFix; $('#btnQuick').onclick = () => runAI('quick'); $('#btnSubmit').onclick = submitNom; $('#btnNew').onclick = resetForm;
  renderPhotoBoxes(); renderRules(); renderGate();
  /* admin */
  $('#l_email').value = localStorage.getItem('rec_email') || '';
  $('#btnLogin').onclick = doLogin; $('#l_pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#btnForgot').onclick = () => { $('#loginBox').hidden = true; $('#resetBox').hidden = false; };
  $('#btnBack').onclick = () => { $('#loginBox').hidden = false; $('#resetBox').hidden = true; };
  $('#btnSendCode').onclick = async () => { try { await api({action:'requestReset', email:$('#l_email').value}); toast(m('codeSent')); } catch (e) { if (e.message === 'NOAPI') $('#noapi').hidden = false; toast(e.message, true); } };
  $('#btnSetPin').onclick = async () => { if ($('#r_pin').value !== $('#r_pin2').value) { toast(m('pinMismatch'), true); return; }
    try { await api({action:'setPin', email:$('#l_email').value, code:$('#r_code').value, pin:$('#r_pin').value}); toast(m('pinSet')); $('#r_code').value = $('#r_pin').value = $('#r_pin2').value = ''; $('#btnBack').click(); } catch (e) { toast(e.message, true); } };
  $('#btnLogout').onclick = async () => { try { await api({action:'logout', token:TOKEN}); } catch (e) {} logoutUI(); };
  $('#btnRefresh').onclick = loadRows;
  $$('#admTabs button').forEach(b => b.onclick = () => { $$('#admTabs button').forEach(x => x.classList.toggle('on', x === b)); $('#a-queue').hidden = b.dataset.a !== 'queue'; $('#a-weekly').hidden = b.dataset.a !== 'weekly'; });
  ['#q_s', '#q_st', '#q_ic'].forEach(s => $(s).addEventListener('input', renderList));
  ['#e_name','#e_nick','#e_role','#e_lv','#e_ic','#e_loc','#e_date','#e_obs','#e_act','#e_out','#e_cdate','#e_para','#e_hand','#e_no'].forEach(s => $(s).addEventListener('input', renderPreview));
  $('#e_lang').onchange = () => { if (cur) { $('#e_para').value = genPara(readEditor(), $('#e_lang').value); renderPreview(); } };
  $('#btnEFix').onclick = () => { if (!cur || !window.TextFix) return; const r = TextFix.fixAll({o:$('#e_obs').value, a:$('#e_act').value, u:$('#e_out').value, p:$('#e_para').value}); $('#e_obs').value = r.text.o; $('#e_act').value = r.text.a; $('#e_out').value = r.text.u; $('#e_para').value = r.text.p; renderPreview(); toast(r.count ? m('fixDone').replace('{n}', r.count) : m('fixNone')); };
  $('#btnRegen').onclick = () => { if (cur) { $('#e_para').value = genPara(readEditor(), $('#e_lang').value); renderPreview(); } };
  $$('#pvTabs button').forEach(b => b.onclick = () => { PVMODE = b.dataset.p; $$('#pvTabs button').forEach(x => x.classList.toggle('on', x === b)); renderPreview(); });
  window.addEventListener('resize', renderPreview);
  async function delIds(ids){
    if (!ids.length) { toast(m('delNone'), true); return; }
    if (!confirm(m('delConfirm').replace('{n}', ids.length))) return;
    try { const j = await admApi({action:'delete', ids}); ids.forEach(id => SEL.delete(id)); if (cur && ids.includes(cur.id)) { cur = null; $('#edBody').hidden = true; $('#edEmpty').hidden = false; } await loadRows(); toast(m('delDone').replace('{n}', j.deleted)); } catch (e) { toast(e.message, true); }
  }
  $('#btnTr').onclick = doTranslate;
  $('#btnDelSel').onclick = () => delIds([...SEL]);
  $('#btnDel').onclick = () => { if (cur) delIds([cur.id]); };
  $('#btnSave').onclick = () => saveRow().catch(e => toast(e.message, true));
  $('#btnApprove').onclick = () => saveRow({status:'Approved'}).catch(e => toast(e.message, true));
  $('#btnReject').onclick = () => saveRow({status:'Rejected'}).catch(e => toast(e.message, true));
  $('#btnIssued').onclick = () => saveRow({status:'Issued'}).catch(e => toast(e.message, true));
  $('#btnPrint').onclick = async () => { const r = await saveRow().catch(e => { toast(e.message, true); return null; }); if (r) printRows([r], 'cert'); };
  $('#btnPrintCard').onclick = async () => { const r = await saveRow().catch(e => { toast(e.message, true); return null; }); if (r) printRows([r], 'card'); };
  $('#btnLeave').onclick = () => { $('#lvBox').hidden = !$('#lvBox').hidden; };
  $('#lvCancel').onclick = () => { $('#lvBox').hidden = true; };
  $('#lv_role').onchange = () => { $('#lv_role2').hidden = $('#lv_role').value !== '__other'; };
  $('#handOpts').addEventListener('change', e => { const v = e.target.value; if (e.target.name !== 'handsel') return; const ta = $('#e_hand'); if (v === 'none') ta.value = ''; else if (v === 'custom') { if (handSet_().m.indexOf(ta.value.trim()) >= 0) ta.value = ''; } else ta.value = handSet_().m[+v]; ta.hidden = v !== 'custom'; if (v === 'custom') ta.focus(); renderPreview(); });
  $('#lvCreate').onclick = async () => {
    const role = $('#lv_role').value === '__other' ? $('#lv_role2').value.trim() : $('#lv_role').value, name = $('#lv_name').value.trim(), ic = $('#lv_ic').value, to = $('#lv_to').value;
    if (!name || !role || !ic || !to) { toast(m('lvNeed'), true); return; }
    const b = $('#lvCreate'); b.disabled = true;
    try { const j = await admApi({action:'adminCreate', fields:{name, role, ic, from:$('#lv_from').value, to, certLang:$('#lv_lang').value}});
      await loadRows(); selectRow(j.id); $('#lvBox').hidden = true; ['lv_name', 'lv_role2', 'lv_from', 'lv_to'].forEach(i => $('#' + i).value = ''); toast(m('lvDone')); }
    catch (e) { toast(e.message, true); }
    b.disabled = false;
  };
  $('#btnPrintCerts').onclick = () => printRows(printTargets(), 'cert');
  $('#selAll').onchange = e => { filtered().forEach(r => e.target.checked ? SEL.add(r.id) : SEL.delete(r.id)); renderList(); };
  $('#btnPrintCards').onclick = () => printRows(printTargets().filter(r => r.category !== LV_CAT), 'card');
  $('#btnCsv').onclick = exportCsv;
  $('#issYes').onclick = markIssued; $('#issNo').onclick = () => $('#issuedBar').hidden = true;
  if (TOKEN) { /* resume session when the admin tab is opened */ }
});
</script>
</body>
</html>
